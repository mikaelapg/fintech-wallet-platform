name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck
      - name: Test notifier and web
        if: ${{ !cancelled() }}
        run: pnpm --filter @wallet/notifier --filter @wallet/web exec vitest run --reporter=default --reporter=github-actions
      - name: Build all packages
        if: ${{ !cancelled() }}
        run: pnpm build

  api-integration:
    name: API integration tests (Postgres + Redis)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wallet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        working-directory: apps/api
        run: pnpm exec vitest run --coverage --reporter=default --reporter=github-actions --reporter=json --outputFile.json=test-results.json
      - name: Test and coverage summary
        if: ${{ !cancelled() }}
        working-directory: apps/api
        run: |
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync("test-results.json", "utf8"));
            const c = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
            const pct = (k) => `${k} ${c[k].pct}%`;
            const line = `API: ${r.numPassedTests}/${r.numTotalTests} tests passed · coverage ${["lines","branches","functions"].map(pct).join(" · ")}`;
            console.log(`::notice title=API tests::${line}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### ${line}\n`);
          '

  kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate
        run: kubectl kustomize k8s | kubeconform -strict -summary -kubernetes-version 1.31.0

  docker:
    name: Build container images
    needs: [quality, api-integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, notifier, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/wallet-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/wallet-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
