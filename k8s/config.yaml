apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-config
  namespace: wallet
data:
  NODE_ENV: production
  LOG_LEVEL: info
  CORS_ORIGIN: https://wallet.example.com
  BALANCE_CACHE_TTL_SECONDS: "60"
---
# Example only. In a real cluster these values come from a secret manager
# (AWS Secrets Manager + External Secrets Operator), never from git.
apiVersion: v1
kind: Secret
metadata:
  name: wallet-secrets
  namespace: wallet
type: Opaque
stringData:
  DATABASE_URL: postgres://wallet:CHANGE_ME@postgres.wallet.svc.cluster.local:5432/wallet
  REDIS_URL: redis://redis.wallet.svc.cluster.local:6379
  RABBITMQ_URL: amqp://wallet:CHANGE_ME@rabbitmq.wallet.svc.cluster.local:5672
  JWT_SECRET: CHANGE_ME_TO_A_LONG_RANDOM_SECRET_VALUE
