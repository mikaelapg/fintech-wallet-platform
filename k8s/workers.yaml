# Outbox relay: safe to run several replicas thanks to FOR UPDATE SKIP LOCKED.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: wallet
  labels: { app.kubernetes.io/name: outbox-relay, app.kubernetes.io/part-of: wallet }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: outbox-relay }
  template:
    metadata:
      labels: { app.kubernetes.io/name: outbox-relay, app.kubernetes.io/part-of: wallet }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: relay
          image: ghcr.io/mikaelapg/wallet-api:latest
          command: ["node", "dist/relay.js"]
          envFrom:
            - configMapRef: { name: wallet-config }
            - secretRef: { name: wallet-secrets }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: wallet
  labels: { app.kubernetes.io/name: notifier, app.kubernetes.io/part-of: wallet }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: notifier }
  template:
    metadata:
      labels: { app.kubernetes.io/name: notifier, app.kubernetes.io/part-of: wallet }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notifier
          image: ghcr.io/mikaelapg/wallet-notifier:latest
          envFrom:
            - configMapRef: { name: wallet-config }
            - secretRef: { name: wallet-secrets }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
